name: Setup
description: Setup Env

runs:
  using: composite
  steps:
    - name: Upload Artifact universal
      uses: actions/upload-artifact@v4
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-universal-debug
        path: android/app/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: warn

    - name: Upload Artifact split apks
      uses: actions/upload-artifact@v4
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-debug
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
